name: Build Branch Artifact

on:
  push:
    branches:
      - pstibrany/fix-ghostty-tab-redraw
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    env:
      MISE_HTTP_TIMEOUT: 120
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@v4
        with:
          version: 2026.3.0
          cache: true
      - name: Xcode cache key
        shell: bash
        run: |
          XCODE_VERSION="$(xcodebuild -version | tr '\n' '-' | sed 's/[^A-Za-z0-9._-]/_/g; s/-$//')"
          printf '%s\n' "XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
      - name: Ghostty cache key
        shell: bash
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git -C ThirdParty/ghostty rev-parse HEAD)"
          printf '%s\n' "GHOSTTY_SHA=$GHOSTTY_SHA" >> "$GITHUB_ENV"
      - name: Ghostty cache
        id: ghostty_cache
        uses: actions/cache@v5
        with:
          path: .build/ghostty
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-ghostty-v2-${{ env.GHOSTTY_SHA }}-${{ hashFiles('.github/actions/setup-macos/action.yml', 'Project.swift', 'scripts/build-ghostty.sh', 'mise.toml', '.gitmodules') }}
      - name: Build ghostty
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          make build-ghostty-xcframework
      - run: make build-app
      - name: Locate built app
        id: app
        shell: bash
        run: |
          settings="$(xcodebuild -workspace supacode.xcworkspace -scheme supacode -configuration Debug -showBuildSettings -json 2>/dev/null)"
          build_dir="$(echo "$settings" | jq -r '.[0].buildSettings.BUILT_PRODUCTS_DIR')"
          product="$(echo "$settings" | jq -r '.[0].buildSettings.FULL_PRODUCT_NAME')"
          echo "path=$build_dir/$product" >> "$GITHUB_OUTPUT"
      - name: Zip app
        shell: bash
        run: |
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" supacode-debug.app.zip
      - uses: actions/upload-artifact@v6
        with:
          name: supacode-debug-app
          path: supacode-debug.app.zip
